[project]
name = "shinywidgets"
description = "Render ipywidgets in Shiny applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["version"]
authors = [{ name = "Carson Sievert", email = "carson@posit.co" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "anywidget",
  "ipywidgets>=8.1",
  "jupyter_core",
  "python-dateutil>=2.8.2",
  # TODO: pin to the next PyPI release (>=1.9.0) once it's out -- we need
  # https://github.com/posit-dev/py-shiny/issues/1889 (custom messages sent
  # outside the message cycle are flushed right away), which isn't released yet
  "shiny @ git+https://github.com/posit-dev/py-shiny.git@main",
]

[project.urls]
Homepage = "https://github.com/rstudio/py-shinywidgets"
Documentation = "https://github.com/rstudio/py-shinywidgets/"
Source = "https://github.com/rstudio/py-shinywidgets/"
Issues = "https://github.com/rstudio/py-shinywidgets/issues"

[project.optional-dependencies]
# Per-renderer extras: each installs the packages needed to use the
# corresponding render decorator (e.g., `pip install 'shinywidgets[plotly]'`).
# anywidget is already a core dependency, so extras don't need to repeat it.
altair = ["altair>=5.1"]
bokeh = ["bokeh", "jupyter_bokeh>=4.1"]
bqplot = ["bqplot"]
holoviews = ["holoviews", "panel", "jupyter_bokeh>=4.1"]
ipyaladin = ["ipyaladin"]
ipycanvas = ["ipycanvas"]
ipycytoscape = ["ipycytoscape"]
ipydatagrid = ["ipydatagrid"]
ipyleaflet = ["ipyleaflet>=0.20.0"]
ipysigma = ["ipysigma"]
itables = ["itables[widget]"]
jscatter = ["jupyter-scatter"]
# An explicit pre-release specifier, so uv/pip accept it without --pre.
# keplergl 0.3.x imports pkg_resources (removed in setuptools 82), so 0.4
# (an anywidget rewrite) is the first version that imports there.
keplergl = ["keplergl>=0.4.0rc4"]
# leafmap.plotlymap uses Plotly's Mapbox API, removed in Plotly 7.
leafmap = ["leafmap", "plotly>=5.12.0,<7"]
# geoarrow-rust-core (a lonboard dependency) doesn't publish wheels for
# Python 3.15+ yet, so lonboard can't be installed there
lonboard = ["lonboard; python_version < '3.15'"]
maplibre = ["maplibre[anywidget]"]
matplotlib = ["matplotlib", "ipympl"]
mosaic_widget = ["mosaic-widget"]
nglview = ["nglview"]
panel = ["panel", "jupyter_bokeh>=4.1"]
# pyarrow is required for pandas DataFrame conversion (perspective-python
# doesn't depend on it)
perspective = ["perspective-python>=3.0", "pyarrow"]
plotly = ["plotly>=5.12.0"]
plotnine = ["plotnine", "ipympl"]
quak = ["quak"]
test = [
  "altair",
  "bokeh",
  "bqplot",
  "coverage>=7",
  # geoviews 1.15 breaks with cartopy 0.26 (KeyError 'lon_0' in project_extents);
  # cartopy 0.25 has no Python 3.14 wheels. Drop the pin and the markers once
  # geoviews supports cartopy>=0.26 (which has 3.14 wheels).
  "cartopy<0.26; python_version < '3.14'",
  "datashader",
  "geoviews; python_version < '3.14'",
  "hvplot",
  "ipyaladin",
  "ipycanvas",
  "ipycytoscape",
  "ipydatagrid",
  "ipyleaflet>=0.20.0",
  "ipysigma",
  "holoviews",
  "ipympl",
  "itables[widget]",
  "matplotlib",
  "jupyter_bokeh>=4.1",
  "jupyter-scatter",
  "keplergl>=0.4.0rc4",
  # geoarrow-rust-core (a lonboard dependency) doesn't publish wheels for
  # Python 3.15+ yet, so lonboard can't be installed there
  "lonboard; python_version < '3.15'",
  "maplibre[anywidget]",
  "nglview",
  "pandas",
  "networkx",
  "mosaic-widget",
  "panel",
  "perspective-python>=3.0",
  "playwright>=1.40.0",
  "plotly>=5.12.0",
  "plotnine",
  "polars",
  "pyarrow",
  "pydeck",
  "pyright>=1.1.284",
  "pytest>=6.2.4",
  "pytest-playwright>=0.3.0",
  "quak",
  "tox-uv>=1",
]
dev = [
  "altair",
  "bokeh",
  "bqplot",
  "coverage>=7",
  # geoviews 1.15 breaks with cartopy 0.26 (KeyError 'lon_0' in project_extents);
  # cartopy 0.25 has no Python 3.14 wheels. Drop the pin and the markers once
  # geoviews supports cartopy>=0.26 (which has 3.14 wheels).
  "cartopy<0.26; python_version < '3.14'",
  "datashader",
  "geoviews; python_version < '3.14'",
  "hvplot",
  "ipyaladin",
  "ipycanvas",
  "ipycytoscape",
  "ipydatagrid",
  "ipyleaflet>=0.20.0",
  "ipysigma",
  "holoviews",
  "ipympl",
  "itables[widget]",
  "matplotlib",
  "jupyter_bokeh>=4.1",
  "jupyter-scatter",
  "keplergl>=0.4.0rc4",
  # geoarrow-rust-core (a lonboard dependency) doesn't publish wheels for
  # Python 3.15+ yet, so lonboard can't be installed there
  "lonboard; python_version < '3.15'",
  "maplibre[anywidget]",
  "nglview",
  "pandas",
  "networkx",
  "mosaic-widget",
  "panel",
  "perspective-python>=3.0",
  "playwright>=1.40.0",
  "plotly>=5.12.0",
  "plotnine",
  "polars",
  "pyarrow",
  "pydeck",
  "pyright>=1.1.284",
  "pytest>=6.2.4",
  "pytest-playwright>=0.3.0",
  "quak",
  "ruff>=0.6.5",
  "tox-uv>=1",
]

[dependency-groups]
test = [
  "altair",
  "bokeh",
  "bqplot",
  "coverage>=7",
  # geoviews 1.15 breaks with cartopy 0.26 (KeyError 'lon_0' in project_extents);
  # cartopy 0.25 has no Python 3.14 wheels. Drop the pin and the markers once
  # geoviews supports cartopy>=0.26 (which has 3.14 wheels).
  "cartopy<0.26; python_version < '3.14'",
  "datashader",
  "geoviews; python_version < '3.14'",
  "hvplot",
  "ipyaladin",
  "ipycanvas",
  "ipycytoscape",
  "ipydatagrid",
  "ipyleaflet>=0.20.0",
  "ipysigma",
  "holoviews",
  "ipympl",
  "itables[widget]",
  "matplotlib",
  "jupyter_bokeh>=4.1",
  "jupyter-scatter",
  "keplergl>=0.4.0rc4",
  # geoarrow-rust-core (a lonboard dependency) doesn't publish wheels for
  # Python 3.15+ yet, so lonboard can't be installed there
  "lonboard; python_version < '3.15'",
  "maplibre[anywidget]",
  "nglview",
  "pandas",
  "networkx",
  "mosaic-widget",
  "panel",
  "perspective-python>=3.0",
  "playwright>=1.40.0",
  "plotly>=5.12.0",
  "plotnine",
  "polars",
  "pyarrow",
  "pydeck",
  "pyright>=1.1.284",
  "pytest>=6.2.4",
  "pytest-playwright>=0.3.0",
  "quak",
  "tox-uv>=1",
]
dev = [
  "ruff>=0.6.5",
  { include-group = "test" },
]

[tool.uv]
# mosaic-widget 0.33.0 declares narwhals>=2.8 but imports is_into_lazyframe,
# which was added in narwhals 2.22. Drop this once upstream fixes its metadata.
constraint-dependencies = ["narwhals>=2.22"]

[build-system]
requires = ["hatchling>=1.26.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

# Needed for the (temporary) git dependency on shiny in project.dependencies
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["shinywidgets"]
include = [
  "shinywidgets/py.typed",
  "shinywidgets/static/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/LICENSE",
  "/Makefile",
  "/README.md",
  "/js",
  "/pyproject.toml",
  "/scripts",
  "/shinywidgets",
  "/tests",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.*)$"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match 'v*'"
local_scheme = "node-and-date"
version_scheme = "no-guess-dev"

[tool.hatch.build.hooks.vcs]
version-file = "shinywidgets/__version.py"

[tool.pyright]
include = ["shinywidgets", "tests"]
exclude = [
  ".venv",
  ".worktrees",
  "build",
  "dist",
  "examples",
  "js",
  "sandbox",
  "tests/playwright",
  "typings",
]
typeCheckingMode = "basic"
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = "--ignore=tests/playwright"
testpaths = ["tests"]

[tool.coverage.run]
source = ["shinywidgets"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "if TYPE_CHECKING:",
  "pragma: no cover",
]

[tool.tox]
legacy_tox_ini = """
[tox]
env_list = type-py3{10,11,12,13,14,15}, py3{10,11,12,13,14,15}
isolated_build = True

[testenv]
package = wheel
wheel_build_env = .pkg
commands = pytest

[testenv:type]
commands = pyright
"""

[tool.ruff]
src = ["shinywidgets", "tests"]
exclude = [
  ".git",
  ".ipynb_checkpoints",
  ".pytest_cache",
  ".tox",
  ".venv",
  ".worktrees",
  "build",
  "dist",
  "node_modules",
  "sandbox",
  "shinywidgets/__version.py",
]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
  "E203",
  "E402",
  "E501",
  "F403",
  "F405",
]

[tool.ruff.lint.per-file-ignores]
"shinywidgets/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
