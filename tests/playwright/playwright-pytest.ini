[pytest]
# -n auto/--dist loadscope: run tests in parallel across pytest-xdist workers,
# keeping each module (and its module-scoped app fixture) on a single worker.
# Shiny gives each worker a disjoint app-port range (shiny.run._run.port_search_range).
# Override locally with -n0 to run serially (e.g., for debugging).
addopts = --strict-markers --browser chromium -vv --maxfail=1 -n auto --dist loadscope --durations=10 --durations-min=5.0
# A hung test must fail quickly rather than stall its CI shard until the job
# timeout. The `thread` method kills the hung xdist worker (which xdist reports
# as a failure of that test); faulthandler dumps every thread's stack to stderr
# just before the kill so the log shows where it hung.
timeout = 180
timeout_method = thread
faulthandler_timeout = 170
