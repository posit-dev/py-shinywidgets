name: py-check.yaml

on:
  push:
    branches: ["main", "rc-*"]
    paths:
      - "shinywidgets/**/*"
      - "tests/**/*"
      - "Makefile"
      - "pyproject.toml"
      - ".github/workflows/py-check.yaml"
  pull_request:
    paths:
      - "shinywidgets/**/*"
      - "tests/**/*"
      - "Makefile"
      - "pyproject.toml"
      - ".github/workflows/py-check.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.x"

jobs:
  py-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6.1.0
        with:
          version: ${{ env.UV_VERSION }}
          # Cache the uv environment across runs (keyed on uv.lock). Mainly
          # protects against repeated source builds of packages without
          # wheels for the newest Pythons (e.g. duckdb)
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-groups

      - name: Check formatting
        run: make check-format

      - name: Check types
        run: make check-types

      - name: Run unit tests (coverage)
        if: matrix.python-version == '3.12'
        run: make coverage-ci

      - name: Run unit tests
        if: matrix.python-version != '3.12'
        run: make check-tests

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Playwright runs in its own job (rather than inside `py-test (3.12)`) so it
  # overlaps with the unit tests, and sharded 4 ways x 3 xdist workers each
  # (the `py-shiny` pattern) to keep wall-clock around 5 minutes.
  py-playwright:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: playwright

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --all-groups

      - name: Run Playwright tests (shard ${{ matrix.shard }}/4)
        # Healthy shards finish in ~5 minutes; kill stragglers quickly
        timeout-minutes: 10
        run: make test-playwright PYTEST_PLAYWRIGHT_ARGS="--num-shards 4 --shard-id ${{ matrix.shard }} -n 3"
