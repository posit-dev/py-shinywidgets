name: Website production deploy

on:
  push:
    branches: ["main"]
    paths:
      # shinywidgets/** because quartodoc builds the API reference from the
      # package's docstrings.
      - "website/**/*"
      - "shinywidgets/**/*"
      - "Makefile"
      - "pyproject.toml"
      - ".github/workflows/docs-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    uses: ./.github/workflows/docs-deploy.yml
    with:
      deploy-context: "production"
    secrets: inherit
